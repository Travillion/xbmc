name: Prepare PR 30130 rebase with reviewed ActiveAESink resolution

on:
  push:
    branches:
      - automation/rebase-pr30130-resolve-20261113

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase saved PR snapshot onto current upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SNAPSHOT="backup/pr30130-tested-002fae4"
          EXPECTED_SNAPSHOT="002fae41e79b4535b4ef205da8606fcdab1f30e3"
          CANDIDATE="candidate/pr-30130-rebased-20261113-resolved"
          SINK_FILE="xbmc/cores/AudioEngine/Engines/ActiveAE/ActiveAESink.cpp"

          git fetch origin "refs/heads/${SNAPSHOT}:refs/remotes/origin/${SNAPSHOT}"
          ACTUAL_SNAPSHOT="$(git rev-parse "refs/remotes/origin/${SNAPSHOT}")"
          test "${ACTUAL_SNAPSHOT}" = "${EXPECTED_SNAPSHOT}"

          git fetch https://github.com/xbmc/xbmc.git master:refs/remotes/upstream/master
          UPSTREAM="$(git rev-parse refs/remotes/upstream/master)"
          BASE="$(git merge-base "${ACTUAL_SNAPSHOT}" "${UPSTREAM}")"

          echo "Saved tested snapshot: ${ACTUAL_SNAPSHOT}"
          echo "Current upstream master: ${UPSTREAM}"
          echo "Calculated common ancestor: ${BASE}"

          git checkout -B rebase-work "${ACTUAL_SNAPSHOT}"

          set +e
          git rebase --no-rebase-merges --onto "${UPSTREAM}" "${BASE}" rebase-work
          REBASE_STATUS=$?
          set -e

          if [ "${REBASE_STATUS}" -ne 0 ]; then
            echo "Rebase stopped. Checking whether this is the one reviewed ActiveAESink conflict."
            UNMERGED="$(git diff --name-only --diff-filter=U)"
            printf 'Unmerged paths:\n%s\n' "${UNMERGED}"
            if [ "${UNMERGED}" != "${SINK_FILE}" ]; then
              echo "::error::Unexpected rebase conflict(s); leaving rebase stopped for inspection."
              exit 1
            fi

            # Keep the current upstream file, then reapply the feature's tested
            # EDL-first IEC pause-burst behavior. The exact-match guard ensures
            # this resolution cannot silently overwrite a changed upstream block.
            git checkout --ours -- "${SINK_FILE}"
            python3 - <<'PY'
          from pathlib import Path

          path = Path("xbmc/cores/AudioEngine/Engines/ActiveAE/ActiveAESink.cpp")
          source = path.read_text()
          upstream = """      if (frames > 0)
                {
                  m_packer->Reset();
                  m_packer->Pack(m_sinkFormat.m_streamInfo, buffer[0], frames);
                }
                else if (samples->pkt->pause_burst_ms > 0)
                {
                  // construct a pause burst if we have already output valid audio
                  bool burst = m_extStreaming && (m_packer->GetBuffer()[0] != 0);
                  if (!m_packer->PackPause(m_sinkFormat.m_streamInfo, samples->pkt->pause_burst_ms, burst))
                    skipSwap = true;
                }
                else
                  m_packer->Reset();"""
          feature = """      if (samples->pkt->pause_burst_ms > 0)
                {
                  // Replace the encoded payload with an IEC61937 pause burst during EDL MUTE.
                  bool burst = m_extStreaming && (m_packer->GetBuffer()[0] != 0);
                  if (!m_packer->PackPause(m_sinkFormat.m_streamInfo, samples->pkt->pause_burst_ms, burst))
                    skipSwap = true;
                }
                else if (frames > 0)
                {
                  m_packer->Reset();
                  m_packer->Pack(m_sinkFormat.m_streamInfo, buffer[0], frames);
                }
                else
                  m_packer->Reset();"""
          if source.count(upstream) != 1:
              raise SystemExit(
                  "Expected upstream OutputSamples block was not found exactly once; "
                  "refusing an automatic resolution."
              )
          path.write_text(source.replace(upstream, feature, 1))
          PY
            git add "${SINK_FILE}"
            GIT_EDITOR=true git rebase --continue
          fi

          echo "Rebase completed. Verifying history and candidate."
          git rev-list --count "${UPSTREAM}..HEAD"
          test -z "$(git rev-list --merges "${UPSTREAM}..HEAD")"
          git log --oneline --decorate -12
          git diff --stat "${UPSTREAM}...HEAD"

          git push origin "HEAD:refs/heads/${CANDIDATE}"
